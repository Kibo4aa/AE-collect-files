name: Screenshots

# Jalankan manual: screenshot jendela aplikasi di Windows (tema terang/gelap, English/日本語/Indonesia)
# untuk mengecek tampilan. Hasilnya ada di Artifacts.

on:
  workflow_dispatch:
    inputs:
      log_images:
        description: "Juga cetak gambar (base64) di log"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pillow
      - name: Screenshots
        run: |
          python packaging/screenshots.py shots
          python packaging/screenshots.py shots 1.25
      - name: Gambar di log (base64)
        if: inputs.log_images
        shell: python
        run: |
          import base64, pathlib
          for p in sorted(pathlib.Path("shots").glob("*.png")):
              data = base64.b64encode(p.read_bytes()).decode()
              print("@@BEGIN " + p.name)
              for i in range(0, len(data), 4000):
                  print("@@" + data[i:i + 4000])
              print("@@END " + p.name)
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error
